name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job installs Flutter, not just Dart: the pub workspace contains Flutter
# packages, and `pub get` cannot resolve it with the Dart SDK alone.
#
# No job names a package. The melos scripts in the root pubspec.yaml select
# them from the workspace.
jobs:
  analyze_and_format:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart run melos run format

      - name: Analyze workspace
        run: dart run melos run lint

  test_dart:
    name: Dart Tests (${{ matrix.os }})
    needs: analyze_and_format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Pure Dart tests
        run: dart run melos run test:dart

  test_flutter:
    name: Flutter Tests (${{ matrix.os }})
    needs: analyze_and_format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter package tests
        run: dart run melos run test:flutter

  publish_dry_run:
    name: Pub Publish Dry Run
    needs: [test_dart, test_flutter]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate package publishability
        run: dart run melos run publish:dry-run
