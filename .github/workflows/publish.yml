name: Publish to Pub.dev

on:
  # `just release` tags each package as <package>-v<version>; pushing the tag
  # publishes that one package. pub.dev only trusts tag pushes (and, if enabled
  # on the package's admin page, workflow_dispatch), not release events.
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (name, e.g. gmana_form, or "all")'
        required: true
        default: 'all'
      dry_run:
        description: 'Perform dry run instead of actual publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analysis
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: Run Dart tests
        run: dart run scripts/test.dart --dart

      - name: Run Flutter tests
        run: dart run scripts/test.dart --flutter

      - name: Publish Packages (Trusted Publishing)
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          TARGET="${{ github.event.inputs.package }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # gmana_utils-v0.1.0 -> gmana_utils, 0.1.0
            TARGET="${GITHUB_REF_NAME%-v*}"
            TAG_VERSION="${GITHUB_REF_NAME##*-v}"
            PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' "packages/$TARGET/pubspec.yaml")"
            if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match packages/$TARGET/pubspec.yaml ($PUBSPEC_VERSION)"
              exit 1
            fi
          fi

          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="false"
          fi

          # publish.sh takes every package under packages/, skips the ones
          # marked `publish_to: none`, and runs them dependencies first.
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$TARGET" != "all" ] && [ -n "$TARGET" ]; then
            # Accept the former "packages/<name>" form as well as a bare name.
            ARGS+=("${TARGET#packages/}")
          fi

          ./publish.sh "${ARGS[@]}"
