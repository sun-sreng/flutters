name: Publish to Pub.dev

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (name, e.g. gmana_form, or "all")'
        required: true
        default: 'all'
      dry_run:
        description: 'Perform dry run instead of actual publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analysis
        run: dart run melos run lint

      - name: Run Dart tests
        run: dart run melos run test:dart

      - name: Run Flutter tests
        run: dart run melos run test:flutter

      - name: Publish Packages (Trusted Publishing)
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          TARGET="${{ github.event.inputs.package }}"

          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="false"
          fi

          # Melos takes the packages from the workspace, leaves out the ones
          # marked `publish_to: none`, and runs them dependencies first, so no
          # package list or order is kept here.
          FILTERS=(--no-private --order-dependents --concurrency=1 --fail-fast)

          if [ "$TARGET" != "all" ] && [ -n "$TARGET" ]; then
            # Accept the former "packages/<name>" form as well as a bare name.
            FILTERS+=(--scope="${TARGET#packages/}")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            dart run melos exec "${FILTERS[@]}" -- dart pub publish --dry-run
          else
            dart run melos exec "${FILTERS[@]}" -- dart pub publish --force
          fi
